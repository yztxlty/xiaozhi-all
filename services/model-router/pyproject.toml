[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-model-router"
version = "0.1.0"
description = "面向多终端实时对话的可替换模型路由器"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.26,<2",
]

[project.scripts]
xiaozhi-dify = "model_router.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-p", "pytest_asyncio.plugin"]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
