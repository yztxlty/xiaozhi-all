<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f4ff">
  <title>幽光 AI 陪伴</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%237653df'/%3E%3Cpath d='M32 13l4.5 14.5L51 32l-14.5 4.5L32 51l-4.5-14.5L13 32l14.5-4.5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="demo-layout" class="demo-layout">
  <main class="app-shell">
    <section id="chat-screen" class="screen chat-screen is-active" aria-label="幽光聊天">
      <header class="chat-header">
        <div class="brand-avatar" aria-hidden="true"><span>✦</span></div>
        <div class="brand-copy">
          <h1>幽光</h1>
          <p><span id="connection-dot" class="connection-dot"></span><span id="connection-label">等待连接</span></p>
        </div>
        <button id="debug-toggle" class="icon-button" type="button" aria-label="展开实时调试日志" aria-expanded="false">⌁</button>
      </header>

      <div id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="message-avatar">✦</div>
          <div class="message-content">
            <span class="message-name">幽光</span>
            <div class="bubble">晚上好呀，我是幽光。想聊聊天，还是直接给我打个电话？</div>
          </div>
        </article>
      </div>

      <footer class="chat-composer">
        <button id="start-call" class="call-entry" type="button">
          <span class="call-entry-icon">☎</span>
          <span><strong>和幽光语音通话</strong><small>免按键，随时可以打断</small></span>
          <span aria-hidden="true">›</span>
        </button>
        <form id="text-form" class="text-form">
          <label class="sr-only" for="text-input">输入消息</label>
          <input id="text-input" autocomplete="off" maxlength="500" placeholder="给幽光发消息…">
          <button id="send-text" type="submit" aria-label="发送消息">↑</button>
        </form>
      </footer>
    </section>

    <section id="call-screen" class="screen call-screen" aria-label="幽光实时语音通话" aria-hidden="true">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <header class="call-header">
        <button id="back-to-chat" class="glass-button" type="button" aria-label="返回聊天">‹</button>
        <div><strong>幽光</strong><span id="call-timer">00:00</span></div>
        <button id="call-debug-toggle" class="glass-button" type="button" aria-label="展开实时调试日志">⌁</button>
      </header>

      <div class="call-stage">
        <div id="mascot" class="mascot" aria-hidden="true"></div>
        <p id="call-status" class="call-status">正在连接幽光…</p>
        <div id="waveform" class="waveform" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p id="call-hint" class="call-hint">连接后直接说话，不需要按住按钮</p>
        <div class="live-transcript" aria-live="polite">
          <p id="user-subtitle" class="user-subtitle"></p>
          <p id="assistant-subtitle" class="assistant-subtitle"></p>
        </div>
        <div class="latency-card"><span>本轮响应</span><strong id="latency-value">—</strong><small>从说完到开始播报</small></div>
      </div>

      <div id="manual-fallback" class="manual-fallback" hidden>
        <span>当前浏览器无法启动免按键模式</span>
        <button id="manual-talk" type="button">按住说话</button>
      </div>
      <form id="call-text-panel" class="call-text-panel" hidden>
        <label class="sr-only" for="call-text-input">通话中输入文字</label>
        <input id="call-text-input" maxlength="500" placeholder="输入文字继续聊…">
        <button type="submit">发送</button>
      </form>
      <footer class="call-controls">
        <button id="mute" class="call-control" type="button"><span>♩</span><small>静音</small></button>
        <button id="show-call-text" class="call-control" type="button"><span>⌨</span><small>文字</small></button>
        <button id="manual-interrupt" class="call-control" type="button"><span>✋</span><small>打断</small></button>
        <button id="hangup" class="call-control hangup" type="button"><span>⌕</span><small>挂断</small></button>
      </footer>
    </section>
  </main>

  <aside id="debug-drawer" class="debug-drawer" aria-label="实时调试日志" aria-hidden="true">
    <header>
      <div><strong>实时调试日志</strong><small>全链路事件与耗时（已脱敏）</small></div>
      <button id="debug-close" type="button" aria-label="收起调试日志">×</button>
    </header>
    <div class="debug-chain">阿里云 Paraformer Realtime v2<br>→ 阿里云通义千问 Qwen 3.7 Flash<br>→ 火山引擎 BigTTS v3</div>
    <div id="debug-log" class="debug-log" aria-live="polite"></div>
    <footer><button id="debug-clear" type="button">清空</button><button id="debug-copy" type="button">复制日志</button></footer>
  </aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script defer src="./运行配置.js"></script>
  <script defer src="./call-core.js"></script>
  <script defer src="./mascot-layer-layout.js"></script>
  <script defer src="./mascot-assets.js"></script>
  <script defer src="./mascot-controller.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
